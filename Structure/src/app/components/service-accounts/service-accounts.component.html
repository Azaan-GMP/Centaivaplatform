<div class="space-y-6 animate-fadeIn">
  <div>
    <h1 class="text-xl font-bold text-white font-display">Service Accounts & Machine Access</h1>
    <p class="text-xs text-slate-400 mt-1">Manage non-human service identities, daemon tokens, and machine client credentials</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div *ngFor="let svc of serviceAccounts()" class="p-6 rounded-2xl border border-[#232328] bg-[#101013] shadow-xl shadow-black/40 space-y-4 hover:border-[#00D4FF]/40 transition-all">
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-[#00D4FF]/10 border border-[#00D4FF]/30 flex items-center justify-center text-[#00D4FF]">
            <app-icon name="code" size="18"></app-icon>
          </div>
          <div>
            <h2 class="text-base font-bold text-white">{{ svc.name }}</h2>
            <code class="text-xs text-slate-400 font-mono">{{ svc.clientId }}</code>
          </div>
        </div>
        <span class="px-2 py-0.5 text-[9px] font-bold text-[#00D4FF] bg-[#00D4FF]/15 border border-[#00D4FF]/40 rounded font-mono">{{ svc.status }}</span>
      </div>

      <p class="text-xs text-slate-400 leading-relaxed">{{ svc.description }}</p>

      <div class="space-y-2 pt-3 border-t border-[#232328] text-xs text-slate-400">
        <div class="flex items-center justify-between">
          <span class="text-slate-500 font-mono">Assigned Roles:</span>
          <span class="font-bold text-[#00D4FF] font-mono">{{ svc.roles?.join(', ') }}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-500 font-mono">Token Expiration:</span>
          <span class="font-mono text-slate-300">{{ svc.expiresAt | date:'mediumDate' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
