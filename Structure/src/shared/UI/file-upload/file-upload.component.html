<div [ngClass]="compact ? 'rounded-xl border border-gray-200 bg-white p-3 shadow-sm sm:p-4' : 'rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-5'">
  <!-- Header -->
  <div *ngIf="showHeader" [ngClass]="compact ? 'mb-3 text-center' : 'mb-4 text-center'">
    <div [ngClass]="compact ? 'mx-auto mb-2 flex h-9 w-9 items-center justify-center rounded-full bg-blue-100' : 'mx-auto mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-blue-100'">
      <svg
        class="h-5 w-5 text-blue-600"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M19.5 14.25v4.125A2.625 2.625 0 0 1 16.875 21H7.125A2.625 2.625 0 0 1 4.5 18.375V14.25M16.5 8.25 12 3.75m0 0L7.5 8.25M12 3.75v12"
        />
      </svg>
    </div>

    <h2 class="text-lg font-semibold text-gray-900">{{ title }}</h2>
    <p class="mt-1 text-xs text-gray-500">
      {{ subtitle }}
    </p>
  </div>

  <!-- Drop Zone -->
  <div *ngIf="!selectedFile"
    [ngClass]="compact
      ? (isDragging ? 'rounded-xl border-2 border-dashed p-3 text-center transition-all duration-200 border-blue-500 bg-blue-50'
                   : 'rounded-xl border-2 border-dashed p-3 text-center transition-all duration-200 border-gray-300 bg-gray-50 hover:border-blue-400 hover:bg-blue-50/40')
      : (isDragging ? 'rounded-xl border-2 border-dashed p-4 text-center transition-all duration-200 border-blue-500 bg-blue-50'
                   : 'rounded-xl border-2 border-dashed p-4 text-center transition-all duration-200 border-gray-300 bg-gray-50 hover:border-blue-400 hover:bg-blue-50/40')"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <div class="flex flex-col items-center justify-center">
      <div class="mb-2 rounded-full bg-white p-2 shadow-sm">
        <svg
          class="h-5 w-5 text-gray-500"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 16V4m0 0-4 4m4-4 4 4M4 16.5v1.125A2.375 2.375 0 0 0 6.375 20h11.25A2.375 2.375 0 0 0 20 17.625V16.5"
          />
        </svg>
      </div>

      <p class="mb-1 text-sm font-medium text-gray-800">
        Drop file here
      </p>

      <p class="mb-2 text-xs text-gray-500">
        {{ acceptedExtensions.join(', ').toUpperCase() }}
      </p>

      <label
        for="shared-file-upload"
        class="inline-flex cursor-pointer items-center rounded-md bg-blue-600 px-4 py-2 text-xs font-medium text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
      >
        {{ buttonText }}
      </label>

      <input
        id="shared-file-upload"
        type="file"
        class="hidden"
        [accept]="acceptAttribute"
        (change)="onFileSelected($event)"
      />
    </div>
  </div>

  <!-- Extensions -->
  <div *ngIf="!selectedFile" [ngClass]="compact ? 'mt-3 rounded-lg bg-gray-50 p-3' : 'mt-4 rounded-lg bg-gray-50 p-4'">
    <div class="flex flex-wrap items-center gap-1 text-[10px] text-gray-500">
      <ng-container *ngFor="let ext of acceptedExtensions">
        <span class="rounded-full border border-gray-200 bg-white px-2 py-0.5 uppercase">
          {{ ext }}
        </span>
      </ng-container>
      <span class="rounded-full border border-blue-200 bg-blue-50 px-2 py-0.5 text-blue-700">
        Max {{ maxFileSizeMb }}MB
      </span>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="mt-3 rounded-md border border-red-200 bg-red-50 p-3 text-xs text-red-700">
    {{ errorMessage }}
  </div>

  <!-- Selected File -->
  <div *ngIf="selectedFile" class="mt-4 rounded-lg border border-gray-200 bg-white p-3 shadow-sm">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <div class="flex h-8 w-8 items-center justify-center rounded-md bg-blue-100 text-blue-700">
            <svg
              class="h-4 w-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12h6m-6 4h6M9 8h6"
              />
            </svg>
          </div>

          <div>
            <p class="max-w-[150px] truncate text-xs font-medium text-gray-900">
              {{ selectedFile.name }}
            </p>
            <p class="text-[10px] text-gray-500">{{ fileSize }}</p>
          </div>
        </div>

        <button
          type="button"
          (click)="removeFile()"
          class="rounded-md border border-red-200 px-2 py-1 text-[11px] text-red-600 hover:bg-red-50"
        >
          Remove
        </button>
      </div>

      <button
        type="button"
        (click)="triggerUpload()"
        class="mt-3 w-full rounded-md bg-green-600 px-3 py-2 text-xs text-white hover:bg-green-700"
      >
        {{ uploadButtonText }}
      </button>
    </div>
  </div>
