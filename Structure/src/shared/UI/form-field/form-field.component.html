<div class="flex flex-col gap-1.5 mb-4">
  <label *ngIf="label" class="block text-[0.82rem] font-semibold text-slate-700">
    {{ label }}
    <span *ngIf="required" class="text-red-500 ml-0.5">*</span>
    <span *ngIf="hint" class="font-normal text-slate-400 text-[0.75rem] ml-1.5">{{ hint }}</span>
  </label>
  <ng-content></ng-content>
  <p *ngIf="errorMessage" class="text-[0.78rem] text-red-600 flex items-center gap-1 mt-0.5">
    <svg class="w-3 h-3 shrink-0" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
    </svg>
    {{ errorMessage }}
  </p>
</div>
