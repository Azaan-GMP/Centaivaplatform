<div class="generic-table-wrapper">
  <!-- Table -->
  <div class="table-responsive">
    <table class="generic-table">
      <thead>
        <tr>
          <th *ngFor="let col of columns" [style.minWidth]="col.width">{{ col.label }}</th>
        </tr>
      </thead>
      <tbody>
        <!-- Loading skeleton -->
        <ng-container *ngIf="isLoading">
          <tr *ngFor="let i of [1,2,3,4,5]" class="skeleton-row">
            <td *ngFor="let col of columns">
              <div class="skeleton-cell"></div>
            </td>
          </tr>
        </ng-container>

        <!-- Empty state -->
        <tr *ngIf="!isLoading && data.length === 0">
          <td [attr.colspan]="columns.length">
            <div class="empty-state">
              <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
                </svg>
              </div>
              <p class="empty-title">No records found</p>
              <p class="empty-subtitle">There are no items to display at this time.</p>
            </div>
          </td>
        </tr>

        <!-- Data rows -->
        <tr *ngFor="let item of data; let odd = odd" [class.odd]="odd" class="data-row">
          <td *ngFor="let col of columns">
            <ng-container [ngSwitch]="col.type">

              <span *ngSwitchCase="'boolean'">
                <span class="status-badge" [ngClass]="getValue(item, col.key) ? 'active' : 'inactive'">
                  <span class="status-dot"></span>
                  {{ getValue(item, col.key) ? 'Active' : 'Inactive' }}
                </span>
              </span>

              <span *ngSwitchCase="'date'">
                {{ getValue(item, col.key) | date:'dd MMM yyyy' }}
              </span>

              <ng-container *ngSwitchCase="'custom'">
                <ng-container *ngTemplateOutlet="customCellTemplate; context: { $implicit: item, column: col }"></ng-container>
              </ng-container>

              <span *ngSwitchDefault class="cell-text">
                {{ getValue(item, col.key) }}
              </span>

            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="table-footer" *ngIf="!isLoading && data.length > 0">
    <span class="record-count">Showing <strong>{{ data.length }}</strong> record{{ data.length !== 1 ? 's' : '' }}</span>
  </div>
</div>
