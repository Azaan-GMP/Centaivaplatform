<div class="flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-white p-2 shadow-sm">
    <div class="min-w-0 flex items-center gap-3">

        <div
            class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-50 text-slate-500 ring-1 ring-slate-200">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                stroke="currentColor" class="h-4 w-4">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 12l8.954-8.955a1.125 1.125 0 011.591 0L21.75 12" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4.5 10.5V19.5a.75.75 0 00.75.75h13.5a.75.75 0 00.75-.75V10.5" />
            </svg>
        </div>

        <div class="min-w-0">
            <h2 *ngIf="title" class="truncate text-sm font-semibold text-slate-900">
                {{ title }}
            </h2>

            <div class="flex flex-wrap items-center gap-1 text-sm" [class.mt-1]="title">

                <ng-container *ngFor="let item of breadcrumbs; let i = index">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                        class="h-4 w-4 text-slate-300">
                        <path fill-rule="evenodd"
                            d="M7.22 14.78a.75.75 0 010-1.06L10.94 10 7.22 6.28a.75.75 0 111.06-1.06l4.25 4.25a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 01-1.06 0z"
                            clip-rule="evenodd" />
                    </svg>

                    <span class="truncate font-medium transition" [ngClass]="
              item.key === activeKey
                ? 'text-slate-900'
                : 'text-slate-500'
            ">
                        {{ item.label }}
                    </span>
                </ng-container>
            </div>
        </div>
    </div>

    <div class="flex shrink-0 items-center gap-2">
        <ng-content></ng-content>
    </div>
</div>
